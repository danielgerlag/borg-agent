name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npx --yes pnpm@12.0.0 install --frozen-lockfile
      - name: Lint
        run: npx --yes pnpm@12.0.0 lint
      - name: Type-check
        run: npx --yes pnpm@12.0.0 typecheck
      - name: Unit tests and coverage
        run: npx --yes pnpm@12.0.0 test:coverage
      - name: Electron tests
        run: npx --yes pnpm@12.0.0 test:e2e

  verify-linux:
    name: verify (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Electron system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libgtk-3-0t64 libnss3 libasound2t64 libgbm1 libxss1 \
            libatk-bridge2.0-0t64 libdrm2 libxkbcommon0 libxcomposite1 \
            libxdamage1 libxrandr2
      # Ubuntu 24.04 blocks unprivileged user namespaces through AppArmor, which Chromium's sandbox needs.
      - name: Allow Chromium sandbox user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install dependencies
        run: npx --yes pnpm@12.0.0 install --frozen-lockfile
      # electron 44 has no postinstall; it downloads its binary on first use. Fetch it up front.
      - name: Download Electron binary
        run: node node_modules/electron/install.js
      - name: Lint
        run: npx --yes pnpm@12.0.0 lint
      - name: Type-check
        run: npx --yes pnpm@12.0.0 typecheck
      - name: Unit tests
        run: npx --yes pnpm@12.0.0 test
      - name: Electron tests
        run: xvfb-run -a npx --yes pnpm@12.0.0 test:e2e
