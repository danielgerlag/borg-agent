name: Unsigned macOS alpha

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npx --yes pnpm@12.0.0 install --trust-lockfile --frozen-lockfile
      - name: Build unsigned app
        run: npx --yes pnpm@12.0.0 package:mac
      - name: Smoke-test packaged app
        run: npx --yes pnpm@12.0.0 verify:package:mac
      - uses: actions/upload-artifact@v4
        with:
          name: Borg-darwin-${{ runner.arch }}-unsigned
          path: .package/Borg-darwin-*.zip
          if-no-files-found: error
          retention-days: 14
