name: Publish npm packages

on:
  workflow_dispatch:
    inputs:
      auth:
        description: How this run logs in to npm
        type: choice
        options:
          - token
          - trusted-publisher
        default: token

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: npx --yes pnpm@12.0.0 install --frozen-lockfile
      - name: Build the public packages
        run: npx --yes pnpm@12.0.0 --filter "@borg-agent/kernel..." build
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          BORG_NPM_AUTH: ${{ inputs.auth }}
        run: node scripts/publish-npm.mjs
